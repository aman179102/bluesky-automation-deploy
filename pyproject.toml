[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky-tech-news"
version = "0.1.0"
description = "Bluesky tech news poster and engagement bot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "Pillow>=10.0,<14.0",
    "python-dotenv>=1.0,<2.0",
    "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
